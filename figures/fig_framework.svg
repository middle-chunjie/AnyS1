<svg xmlns="http://www.w3.org/2000/svg"
     width="16cm" height="5.5111cm"
     viewBox="0 0 1800 620"
     role="img" aria-labelledby="figure-title figure-description"
     font-family="Arial, Helvetica, sans-serif"
     font-size="24" font-weight="400"
     fill="#24343B"
     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

  <title id="figure-title">Any-DP learning and AnyS1 dual-system execution</title>
  <desc id="figure-description">
    Offline, an LLM mines typed decision points with verbatim evidence from skills
    in three runs, retaining merged points supported by at least two runs.
    OpenHands executes a task in an isolated container to obtain an authentic
    state. Two LLM teacher passes, using original and reversed option orders,
    must agree. The resulting data train one general 4B System-1 with a pointer
    head. Online, the same System-1 answers enumerable decisions in one forward
    pass, accepting sufficiently confident answers and deferring others to
    System-2. Code executes deterministic steps and System-2 handles generation.
  </desc>

  <defs>
    <marker id="arrowhead"
            viewBox="0 0 8 8"
            markerWidth="8" markerHeight="8"
            refX="7" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L8 4 L0 8 Z" fill="#4B5C66" stroke="none"/>
    </marker>

    <style>
      .region-title { font-size:29px; font-weight:700; }
      .chip-label { font-weight:700; }
      .muted { fill:#4B5C66; }
      .s1-text { fill:#176D61; }
      .s2-text { fill:#AC6023; }
      .link { fill:none; stroke:#4B5C66; }
      .arrow {
        fill:none;
        stroke:#4B5C66;
        marker-end:url(#arrowhead);
      }
    </style>

    <!-- Shared icon set: use at natural size to preserve the stroke width. -->
    <g id="icon-system-1">
      <circle cx="18" cy="18" r="18" fill="#D4EFE6"/>
      <path d="M20 6 L10 20 H17 L14 30 L27 15 H20 Z"
            fill="#299D8D"/>
    </g>

    <g id="icon-system-2">
      <circle cx="18" cy="18" r="18" fill="#FDEBD4"/>
      <path d="M9 11 L26 10 M9 11 L18 18 L26 10
               M18 18 L10 26 L27 25 L18 18"
            fill="none" stroke="#AC6023"/>
      <g fill="#FFFFFF" stroke="#AC6023">
        <circle cx="9" cy="11" r="2.4"/>
        <circle cx="26" cy="10" r="2.4"/>
        <circle cx="18" cy="18" r="2.4"/>
        <circle cx="10" cy="26" r="2.4"/>
        <circle cx="27" cy="25" r="2.4"/>
      </g>
    </g>

    <g id="icon-code">
      <circle cx="18" cy="18" r="18" fill="#E9EDEF"/>
      <path d="M12 11 L6 18 L12 25
               M24 11 L30 18 L24 25
               M21 9 L15 27"
            fill="none" stroke="#4B5C66"/>
    </g>

    <g id="icon-skill" fill="#FFFFFF" stroke="#4B5C66">
      <path d="M3 1 H24 L35 12 V43 H3 Z"/>
      <path d="M24 1 V12 H35" fill="#E9EDEF"/>
      <path d="M9 21 H28 M9 28 H28 M9 35 H22" fill="none"/>
    </g>

    <g id="icon-hand-picked" fill="#FFFFFF" stroke="#4B5C66">
      <path d="M14 3 C9 1 5 5 7 10
               L2.8 14.2 A3.2 3.2 0 0 0 7.3 18.7
               L11.5 14.5 C16.5 16.5 20.5 12.5 18.5 7.5
               L15 11 L11 7 Z"/>
      <circle cx="5.2" cy="16.3" r="1"
              fill="#4B5C66" stroke="none"/>
    </g>

    <g id="icon-agent" fill="none" stroke="#4B5C66">
      <path d="M18 4 V9"/>
      <circle cx="18" cy="3" r="2" fill="#4B5C66" stroke="none"/>
      <rect x="4" y="9" width="28" height="22" rx="6" fill="#E9EDEF"/>
      <path d="M1 16 V24 M35 16 V24"/>
      <circle cx="12" cy="19" r="2" fill="#4B5C66" stroke="none"/>
      <circle cx="24" cy="19" r="2" fill="#4B5C66" stroke="none"/>
      <path d="M12 25 Q18 29 24 25"/>
    </g>
  </defs>

  <!-- Two softly tinted regions, rather than four pipeline columns. -->
  <rect width="1800" height="620" fill="#FFFFFF"/>

  <rect x="16" y="16" width="1136" height="588" rx="24"
        fill="#E9EDEF" fill-opacity="0.34"
        stroke="#4B5C66" stroke-opacity="0.12"/>

  <rect x="1168" y="16" width="616" height="588" rx="24"
        fill="#D4EFE6" fill-opacity="0.18"
        stroke="#299D8D" stroke-opacity="0.18"/>

  <text id="offline-region-title"
        x="40" y="54" class="region-title">Any-DP: learning from skills</text>
  <text id="offline-region-mode"
        x="1128" y="52" text-anchor="end" class="muted">offline</text>

  <text id="online-region-title"
        x="1192" y="54" class="region-title">Dual-system execution</text>
  <text id="online-region-mode"
        x="1760" y="52" text-anchor="end" class="muted">online</text>

  <!-- The mined question and authentic state converge at the teachers. -->
  <path class="link" d="M584 142 H724 Q770 142 770 188 V220"/>
  <path class="link" d="M740 520 Q770 520 770 481 V220"/>
  <path class="arrow" d="M770 220 H790"/>

  <!-- One trained model is reused by the online agent. -->
  <path id="shared-model-connection" class="arrow"
        d="M1118 420
           C1160 420 1142 354 1150 249
           C1154 191 1185 192 1213 216"/>

  <!-- Mined decision callout. -->
  <text id="mined-question"
        x="40" y="104" font-size="24">Q: What kind of UI/UX work?</text>

  <g fill="#E9EDEF">
    <rect x="40" y="125" width="86" height="34" rx="17"/>
    <rect x="134" y="125" width="72" height="34" rx="17"/>
    <rect x="214" y="125" width="86" height="34" rx="17"/>
    <rect x="308" y="125" width="50" height="34" rx="17"/>
    <rect x="366" y="125" width="208" height="34" rx="17"/>
  </g>

  <text id="option-design"
        x="83" y="149" text-anchor="middle"
        class="chip-label muted">design</text>
  <text id="option-build"
        x="170" y="149" text-anchor="middle"
        class="chip-label muted">build</text>
  <text id="option-review"
        x="257" y="149" text-anchor="middle"
        class="chip-label muted">review</text>
  <text id="option-fix"
        x="333" y="149" text-anchor="middle"
        class="chip-label muted">fix</text>
  <text id="option-none"
        x="470" y="149" text-anchor="middle"
        class="chip-label muted">none of the above</text>

  <path class="arrow" d="M370 211 V169"/>
  <use href="#icon-system-2" x="416" y="170"/>
  <text id="mining-runs"
        x="462" y="196" class="s2-text">mine 3×</text>

  <!-- Central skill page and small library stack. -->
  <use href="#icon-skill" x="76" y="251"/>
  <use href="#icon-skill" x="68" y="259"/>
  <use href="#icon-skill" x="60" y="267"/>
  <text id="skill-library-label"
        x="86" y="340" text-anchor="middle"
        class="muted">skills</text>
  <path class="arrow" d="M116 293 H180"/>

  <path id="source-skill-page"
        d="M190 211 H708 L740 243 V410 H190 Z"
        fill="#FFFFFF" stroke="#4B5C66" stroke-opacity="0.55"/>
  <path d="M708 211 V243 H740"
        fill="#E9EDEF" stroke="#4B5C66" stroke-opacity="0.55"/>

  <text id="source-skill-filename"
        x="212" y="248" font-size="24"
        class="muted">frontend-review/SKILL.md</text>

  <g fill="#FFF1AC">
    <rect x="208" y="271" width="470" height="29" rx="3"/>
    <rect x="208" y="304" width="478" height="29" rx="3"/>
    <rect x="208" y="337" width="389" height="29" rx="3"/>
  </g>

  <text id="source-verbatim-quote" x="212" y="293" font-size="24">
    <tspan x="212" y="293">decide what kind of UI/UX work the request</tspan>
    <tspan x="212" y="326">asks for: a new design, building it, reviewing</tspan>
    <tspan x="212" y="359">existing UI, or fixing a specific issue</tspan>
  </text>

  <!-- Executing a task produces an authentic state. -->
  <path class="arrow" d="M440 411 V436"/>
  <text id="executed-task-label"
        x="464" y="434" class="s2-text">LLM task</text>

  <rect x="40" y="444" width="700" height="140" rx="14"
        fill="#FFFFFF"/>
  <path d="M54 444 H726 Q740 444 740 458
           V489 H40 V458 Q40 444 54 444 Z"
        fill="#E9EDEF" fill-opacity="0.7"/>
  <rect x="40" y="444" width="700" height="140" rx="14"
        fill="none" stroke="#4B5C66" stroke-opacity="0.38"/>

  <use href="#icon-agent" x="54" y="449"/>
  <text id="container-agent-label"
        x="102" y="477">OpenHands · isolated container</text>

  <g fill="#4B5C66" fill-opacity="0.4">
    <circle cx="682" cy="466" r="3"/>
    <circle cx="696" cy="466" r="3"/>
    <circle cx="710" cy="466" r="3"/>
  </g>

  <text id="authentic-state-label"
        x="60" y="520" class="muted">authentic state s</text>
  <text id="authentic-state-message"
        x="60" y="556">"landing.html attached - can you tell me what feels off?"</text>

  <!-- Two LLM passes reverse the option order and must agree. -->
  <text id="teacher-input"
        x="798" y="220">LLM teachers · (s, q, O)</text>

  <use href="#icon-system-2" x="865" y="237"/>
  <use href="#icon-system-2" x="1035" y="237"/>

  <text id="teacher-original-order"
        x="883" y="295" text-anchor="middle"
        class="s2-text">original O</text>
  <text id="teacher-reversed-order"
        x="1053" y="295" text-anchor="middle"
        class="s2-text">reversed O</text>

  <rect x="827" y="306" width="112" height="34" rx="17"
        fill="#D4EFE6"/>
  <rect x="997" y="306" width="112" height="34" rx="17"
        fill="#D4EFE6"/>

  <text id="teacher-original-answer"
        x="883" y="330" text-anchor="middle"
        class="chip-label s1-text">review</text>
  <text id="teacher-reversed-answer"
        x="1053" y="330" text-anchor="middle"
        class="chip-label s1-text">review</text>
  <text id="teacher-agreement-sign"
        x="968" y="330" text-anchor="middle"
        class="muted">=</text>

  <path class="link" d="M883 341 V351 H1053 V341"/>
  <text id="consensus-label"
        x="968" y="379" text-anchor="middle"
        class="s1-text">keep if agree: y = review</text>
  <path class="arrow" d="M968 387 V395"/>

  <!-- A single general model, with an illustrative option distribution. -->
  <rect x="798" y="400" width="320" height="40" rx="20"
        fill="#D4EFE6"/>
  <use href="#icon-system-1" x="804" y="402"/>
  <text id="general-system-one"
        x="848" y="428"
        class="chip-label s1-text">one general System-1</text>

  <text id="general-model-architecture"
        x="958" y="463" text-anchor="middle"
        class="s1-text">4B · pointer head</text>
  <text id="probabilities-illustrative"
        x="1118" y="489" text-anchor="end"
        class="muted">illustrative</text>

  <g fill="#E9EDEF">
    <rect x="880" y="500" width="186" height="14" rx="3"/>
    <rect x="880" y="524" width="186" height="14" rx="3"/>
    <rect x="880" y="548" width="186" height="14" rx="3"/>
    <rect x="880" y="572" width="186" height="14" rx="3"/>
  </g>
  <g fill="#299D8D">
    <rect x="880" y="500" width="169.26" height="14" rx="3"/>
    <rect x="880" y="524" width="11.16" height="14" rx="3"/>
    <rect x="880" y="548" width="3.72" height="14" rx="1.86"/>
    <rect x="880" y="572" width="1.86" height="14" rx="0.93"/>
  </g>

  <text id="probability-review-label"
        x="798" y="515" class="s1-text">review</text>
  <text id="probability-review-value"
        x="1118" y="515" text-anchor="end"
        class="s1-text">.91</text>
  <text id="probability-fix-label" x="798" y="539">fix</text>
  <text id="probability-fix-value"
        x="1118" y="539" text-anchor="end">.06</text>
  <text id="probability-design-label" x="798" y="563">design</text>
  <text id="probability-design-value"
        x="1118" y="563" text-anchor="end">.02</text>
  <text id="probability-others-label" x="798" y="587">others</text>
  <text id="probability-others-value"
        x="1118" y="587" text-anchor="end">.01</text>

  <!-- Online agent and the selected skill. -->
  <use href="#icon-agent" x="1218" y="94"/>
  <text id="runtime-agent-label"
        x="1236" y="153" text-anchor="middle"
        class="muted">any agent</text>
  <path class="arrow" d="M1264 112 H1281"/>
  <use href="#icon-skill" x="1290" y="92"/>
  <text id="runtime-skill-filename"
        x="1336" y="119"
        class="muted">frontend-review/SKILL.md</text>

  <path id="execution-timeline"
        d="M1236 168 V546"
        fill="none" stroke="#4B5C66" stroke-opacity="0.5"/>

  <!-- E: confident decision accepted. -->
  <circle cx="1236" cy="216" r="17"
          fill="#D4EFE6" stroke="#299D8D"/>
  <text id="runtime-ui-type"
        x="1236" y="224" text-anchor="middle"
        class="chip-label s1-text">E</text>

  <rect x="1270" y="165" width="158" height="30" rx="3"
        fill="#FFF1AC"/>
  <text id="runtime-ui-step"
        x="1274" y="188" font-size="24">UI work type?</text>

  <path class="arrow" d="M1254 216 H1267"/>
  <rect x="1274" y="196" width="176" height="40" rx="20"
        fill="#D4EFE6"/>
  <use href="#icon-system-1" x="1277" y="198"/>
  <text id="runtime-ui-executor"
        x="1320" y="224" font-size="24"
        class="chip-label s1-text">System-1</text>
  <text id="runtime-ui-acceptance"
        x="1470" y="224"
        class="s1-text">high conf. · accept review</text>

  <!-- D: code execution. -->
  <circle cx="1236" cy="326" r="17"
          fill="#E9EDEF" stroke="#4B5C66"/>
  <text id="runtime-inspect-type"
        x="1236" y="334" text-anchor="middle"
        class="chip-label muted">D</text>

  <text id="runtime-inspect-step"
        x="1274" y="298" font-size="24">inspect page</text>
  <path class="arrow" d="M1254 326 H1267"/>
  <rect x="1274" y="306" width="120" height="40" rx="20"
        fill="#E9EDEF"/>
  <use href="#icon-code" x="1277" y="308"/>
  <text id="runtime-inspect-executor"
        x="1320" y="334" font-size="24"
        class="chip-label muted">code</text>

  <!-- E: low confidence defers the decision to System-2. -->
  <circle cx="1236" cy="436" r="17"
          fill="#D4EFE6" stroke="#299D8D"/>
  <text id="runtime-contrast-type"
        x="1236" y="444" text-anchor="middle"
        class="chip-label s1-text">E</text>

  <text id="runtime-contrast-step"
        x="1274" y="408" font-size="24">contrast ok?</text>
  <path class="arrow" d="M1254 436 H1267"/>
  <rect x="1274" y="416" width="176" height="40" rx="20"
        fill="#D4EFE6"/>
  <use href="#icon-system-1" x="1277" y="418"/>
  <text id="runtime-contrast-executor"
        x="1320" y="444" font-size="24"
        class="chip-label s1-text">System-1</text>

  <text id="runtime-contrast-deferral"
        x="1498" y="408"
        class="s2-text">low conf. · defer</text>
  <path class="arrow" d="M1461 436 H1489"/>
  <rect x="1498" y="416" width="176" height="40" rx="20"
        fill="#FDEBD4"/>
  <use href="#icon-system-2" x="1501" y="418"/>
  <text id="runtime-contrast-fallback"
        x="1544" y="444" font-size="24"
        class="chip-label s2-text">System-2</text>

  <!-- G: open generation. -->
  <circle cx="1236" cy="546" r="17"
          fill="#FDEBD4" stroke="#AC6023"/>
  <text id="runtime-critique-type"
        x="1236" y="554" text-anchor="middle"
        class="chip-label s2-text">G</text>

  <text id="runtime-critique-step"
        x="1274" y="518" font-size="24">write critique</text>
  <path class="arrow" d="M1254 546 H1267"/>
  <rect x="1274" y="526" width="176" height="40" rx="20"
        fill="#FDEBD4"/>
  <use href="#icon-system-2" x="1277" y="528"/>
  <text id="runtime-critique-executor"
        x="1320" y="554" font-size="24"
        class="chip-label s2-text">System-2</text>
</svg>